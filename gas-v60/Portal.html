<!doctype html><html lang="vi"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:Roboto,Arial,sans-serif;margin:0;background:#f5f6f8;color:#202936}header{background:#a30f12;color:white;text-align:center;padding:20px}header h2{color:#ffd700}main{max-width:1100px;margin:auto;padding:16px}section{background:white;padding:16px;border-radius:10px;margin-bottom:14px}button{background:#a30f12;color:white;padding:10px 16px;border:0;border-radius:6px;cursor:pointer}button:disabled{opacity:.5}label{display:block;margin:8px 0}input,select{box-sizing:border-box;padding:10px;width:100%;border:1px solid #ccc;border-radius:5px}table{border-collapse:collapse;width:100%}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}.scroll{overflow:auto}footer{text-align:center;padding:12px}#status{white-space:pre-wrap}</style></head><body><header><h1>ỦY BAN MẶT TRẬN TỔ QUỐC VIỆT NAM TỈNH AN GIANG</h1><h2>HỆ THỐNG QUẢN LÝ NHÀ ĐẠI ĐOÀN KẾT SỐ</h2>V6.0 — kiểm thử kết nối GAS</header><main><section><b>CHỈ SỬ DỤNG DỮ LIỆU GIẢ LẬP</b><p id="status">Đang xác minh phiên...</p><button id="reload">Tải lại dữ liệu</button></section><section id="records" hidden><h2>Hồ sơ trong phạm vi tài khoản</h2><div class="scroll"><table><thead><tr><th>Mã</th><th>Đơn vị</th><th>Chủ hộ</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="body"></tbody></table></div></section><section id="editor" hidden><h2>Nhập hồ sơ nháp mẫu</h2><form id="form"><label>Đơn vị<select name="unit" required></select></label><label>Chủ hộ<input name="hoTen" required maxlength="300"></label><label>Địa chỉ<input name="diaChi" required maxlength="300"></label><label>Ghi chú<input name="ghiChu" maxlength="1000"></label><button>Lưu</button> <button type="button" id="newRecord">Tạo mới</button></form></section></main><footer>Thiết kế và phát triển hệ thống: Vũ Duy Khánh</footer><script>
const $=id=>document.getElementById(id);let session=null,units=[],records=[],editing=null;
const call=(action,extra={})=>new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r&&r.ok?resolve(r.data):reject(Error(r?.error||'SERVER_ERROR'))).withFailureHandler(()=>reject(Error('CONNECTION_ERROR'))).apiV60({action,...extra}));
function status(s){$('status').textContent=s}function reset(){editing=null;HTMLFormElement.prototype.reset.call($('form'));$('form').elements.unit.disabled=false}
function draw(){let body=$('body');body.replaceChildren();for(let r of records){let tr=document.createElement('tr');for(let v of [r.id,units.find(u=>u.id===r.unitId)?.name||r.unitId,r.data.hoTen,r.data.trangThai]){let td=document.createElement('td');td.textContent=v||'—';tr.append(td)}let td=document.createElement('td');if(['SUPER_ADMIN','PROVINCE_ADMIN','UNIT_EDITOR'].includes(session.role)&&['DRAFT','SUPPLEMENT'].includes(r.data.approval)){let b=document.createElement('button');b.textContent='Sửa';b.onclick=()=>{editing=r;let f=$('form').elements;f.unit.value=r.unitId;f.unit.disabled=true;for(let k of ['hoTen','diaChi','ghiChu'])f[k].value=r.data[k]||''};td.append(b)}tr.append(td);body.append(tr)}}
async function load(){session=null;records=[];$('records').hidden=$('editor').hidden=true;try{session=await call('session');units=await call('units.list');records=await call('records.list');let sel=$('form').elements.unit;sel.replaceChildren();for(let u of units){let o=document.createElement('option');o.value=u.id;o.textContent=u.name;sel.append(o)}reset();draw();$('records').hidden=false;$('editor').hidden=!['SUPER_ADMIN','PROVINCE_ADMIN','UNIT_EDITOR'].includes(session.role);status('Phiên: '+session.role+' | '+(session.unitId||'Toàn tỉnh')+' | '+records.length+' hồ sơ')}catch(e){status('Không thể kết nối: '+e.message)}}
$('reload').onclick=load;$('newRecord').onclick=reset;$('form').onsubmit=async e=>{e.preventDefault();let b=e.target.querySelector('button');b.disabled=true;try{let f=e.target.elements;await call(editing?'records.update':'records.create',{id:editing?.id,version:editing?.version,unitId:f.unit.value,data:{hoTen:f.hoTen.value,diaChi:f.diaChi.value,ghiChu:f.ghiChu.value}});await load()}catch(e){status('Không lưu được: '+e.message)}finally{b.disabled=false}};load();
</script></body></html>
